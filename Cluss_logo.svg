<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 玻璃质感渐变：高不透明度，色彩扎实饱满 -->
    <linearGradient id="glass1" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C7D2FE" stop-opacity="1.0"/>
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="glass2" x1="100" y1="50" x2="400" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DDD6FE" stop-opacity="1.0"/>
      <stop offset="100%" stop-color="#F3E8FF" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="glass3" x1="150" y1="450" x2="450" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="1.0"/>
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.85"/>
    </linearGradient>

    <!-- 外部玻璃卡片的投影（保留，让卡片本身有悬浮感） -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#818CF8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 背景透明，直接嵌入应用 -->
  
  <!-- 三层交叠的圆角玻璃切片 -->
  <g filter="url(#soft-shadow)">
    <!-- 底层玻璃片 -->
    <rect x="106" y="106" width="300" height="300" rx="72" fill="url(#glass1)" transform="rotate(-15 256 256)"/>
    <!-- 中层玻璃片 -->
    <rect x="106" y="106" width="300" height="300" rx="72" fill="url(#glass2)" transform="rotate(15 256 256)"/>
    <!-- 顶层玻璃片 -->
    <rect x="136" y="136" width="240" height="240" rx="60" fill="url(#glass3)" transform="rotate(45 256 256)"/>
  </g>

  <!-- 中心解题元素：纯白实心、绝对对称的圆润四角星（无阴影，扁平纯净） -->
  <g>
    <path d="M 256 200 
             Q 268 244 312 256 
             Q 268 268 256 312 
             Q 244 268 200 256 
             Q 244 244 256 200 Z" 
          fill="#FFFFFF" />
  </g>
</svg>